name: talleres

services:
  api:
    build:
      context: .
      dockerfile: src/Talleres.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      BaseDatos__AplicarMigracionesAlIniciar: "${TALLERES_APLICAR_MIGRACIONES:-false}"
      Http__UsarRedireccionHttps: "false"
      Autenticacion__CookieSegura: "${TALLERES_COOKIE_SEGURA:-false}"
      Autenticacion__FrontalUrl: "${TALLERES_URL_PUBLICA:-}"
      Proxy__PrefijoPublico: "/backend"
      ConnectionStrings__TallerDb: "${TALLERES_CONNECTION_STRING:?Configure TALLERES_CONNECTION_STRING en Coolify o en el archivo .env local}"
      ConnectionStrings__SmartNova: "${SMART_NOVA_CONNECTION_STRING:?Configure SMART_NOVA_CONNECTION_STRING en Coolify o en el archivo .env local}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      MICROSOFT_CLIENT_ID: "${MICROSOFT_CLIENT_ID:-}"
      MICROSOFT_CLIENT_SECRET: "${MICROSOFT_CLIENT_SECRET:-}"
      AWS_S3_BUCKET: "${AWS_S3_BUCKET:-biossoft-mereb-crm}"
      AWS_REGION: "${AWS_REGION:-eu-north-1}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      AmazonS3__UrlBucket: "${AmazonS3__UrlBucket:-}"
      AmazonS3__Region: "${AmazonS3__Region:-}"
      AmazonS3__AwsAccesKey: "${AmazonS3__AwsAccesKey:-}"
      AmazonS3__AwsSecretKey: "${AmazonS3__AwsSecretKey:-}"
      Cors__OrigenesPermitidos__0: "http://localhost:${TALLERES_WEB_PORT:-3000}"
      Cors__OrigenesPermitidos__1: "http://127.0.0.1:${TALLERES_WEB_PORT:-3000}"
      Cors__OrigenesPermitidos__2: "${TALLERES_URL_PUBLICA:-http://localhost:${TALLERES_WEB_PORT:-3000}}"
    expose:
      - "8080"
    volumes:
      - claves-proteccion-api:/home/app/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/salud"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 120s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: src/Talleres.Web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /backend
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      TALLERES_API_INTERNA_URL: http://api:8080
    expose:
      - "3000"
    ports:
      - "${TALLERES_WEB_IP_PUBLICACION:-127.0.0.1}:${TALLERES_WEB_PORT:-0}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    init: true
    restart: unless-stopped

volumes:
  claves-proteccion-api:

name: talleres

services:
  api:
    build:
      context: .
      dockerfile: src/Talleres.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      BaseDatos__AplicarMigracionesAlIniciar: "${TALLERES_APLICAR_MIGRACIONES:-false}"
      Http__UsarRedireccionHttps: "false"
      ConnectionStrings__TallerDb: "${TALLERES_CONNECTION_STRING:?Defina TALLERES_CONNECTION_STRING en el archivo .env}"
      Cors__OrigenesPermitidos__0: "http://localhost:${TALLERES_WEB_PORT:-3000}"
      Cors__OrigenesPermitidos__1: "http://127.0.0.1:${TALLERES_WEB_PORT:-3000}"
    ports:
      - "127.0.0.1:${TALLERES_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/salud"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: src/Talleres.Web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /backend
        NEXT_PUBLIC_EMPRESA_ID: "${TALLERES_EMPRESA_ID:-1}"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      TALLERES_API_INTERNA_URL: http://api:8080
    ports:
      - "${TALLERES_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    init: true
    restart: unless-stopped
